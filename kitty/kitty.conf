# ╔══════════════════════════════════════════════════════╗
# ║              kitty.conf — complete config            ║
# ║  Reload anytime with ctrl+shift+f5 (no restart)     ║
# ╚══════════════════════════════════════════════════════╝

# ── FONT ────────────────────────────────────────────────
# Use `kitty +list-fonts` to see exact names available.
# Nerd Fonts recommended for icons/powerline symbols.
shell_integration enabled no-cursor
macos_traditional_fullscreen yes

font_family                  JetBrainsMono Nerd Font
bold_font                    auto
italic_font                  auto
bold_italic_font             auto
font_size                    13.0


# Fine-tune spacing — tweak if font feels cramped or loose
adjust_line_height           110%
adjust_column_width          100%
adjust_baseline              0

# Ligatures — enable +liga +calt for fonts that support it
font_features                JetBrainsMonoNerdFont-Regular +liga +calt
font_features                JetBrainsMonoNerdFont-Bold    +liga +calt

# Symbol mapping — fallback for icons not in your main font
symbol_map                   U+E0A0-U+E0D8,U+E700-U+E864 JetBrainsMono Nerd Font

# ── CURSOR ──────────────────────────────────────────────
# cursor_shape: block | beam | underline

cursor_shape           block 
cursor_beam_thickness   7.5
cursor_blink_interval   0.5
cursor_stop_blinking_after  15.0

# Add these lines for the animation:
cursor_trail            3
cursor_trail_decay      0.1 0.4
cursor_trail_start_threshold 2

# ── SCROLLBACK ──────────────────────────────────────────
scrollback_lines             10000000
scrollback_pager             less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER
wheel_scroll_multiplier      5.0
touch_scroll_multiplier      1.0

# ── MOUSE ───────────────────────────────────────────────
mouse_hide_wait              3.0
url_style                    curly
open_url_with                default
copy_on_select               no
focus_follows_mouse          no

# ── WINDOW ──────────────────────────────────────────────
window_padding_width         0 0 0 0
window_margin_width          0 0 0 0
placement_strategy           center
hide_window_decorations      yes
confirm_os_window_close      0
resize_in_steps              no
os_window_state maximized
# Transparency & blur
background_opacity           0.90
background_blur              64
dynamic_background_opacity   yes

# Bell
enable_audio_bell            no
visual_bell_duration         0.0
window_alert_on_bell         yes

# Cursor colors
cursor                       #f5e0dc
cursor_text_color            #1e1e2e
url_color                    #89b4fa

# ── TABS ────────────────────────────────────────────────
tab_bar_style                powerline
tab_powerline_style          slanted
tab_bar_edge                 bottom
tab_bar_margin_width         0.0
tab_bar_min_tabs             2
tab_title_template           "{index}: {title}"
active_tab_title_template    none

tab_bar_background           #181825
active_tab_foreground        #1e1e2e
active_tab_background        #cba6f7
inactive_tab_foreground      #6c7086
inactive_tab_background      #181825
active_tab_font_style        bold
inactive_tab_font_style      normal

# ── LAYOUTS ─────────────────────────────────────────────
enabled_layouts              tall, stack, splits, grid

# ── COLORS (Catppuccin Mocha) ───────────────────────────
background                   #1e1e2e
foreground                   #cdd6f4
selection_background         #f5e0dc
selection_foreground         #1e1e2e
# black
color0   #45475a
color8   #585b70
# red
color1   #f38ba8
color9   #f38ba8
# green
color2   #a6e3a1
color10  #a6e3a1
# yellow
color3   #f9e2af
color11  #f9e2af
# blue
color4   #89b4fa
color12  #89b4fa
# mauve
color5   #cba6f7
color13  #cba6f7
# sky
color6   #89dceb
color14  #89dceb
# white
color7   #bac2de
color15  #a6adc8
# ── PERFORMANCE ─────────────────────────────────────────
repaint_delay                10
input_delay                  3
sync_to_monitor              yes

# ── SHELL & ENVIRONMENT ─────────────────────────────────
shell                        .
editor                       .
close_on_child_death         no
allow_remote_control         yes
listen_on                    unix:/tmp/kitty
shell_integration            enabled

# ── KEYBINDS ────────────────────────────────────────────
map  cmd+space        no_op

# Tabs
map  cmd+t            new_tab_with_cwd
map  cmd+w            close_tab
map  cmd+n        next_tab
map  cmd+m        previous_tab
map  cmd+.            move_tab_forward
map  cmd+,            move_tab_backward
map  cmd+shift+t      set_tab_title

# Windows
map  cmd+enter        new_window_with_cwd
map  cmd+d            close_window
map  cmd+]            next_window
map  cmd+[            previous_window
map  cmd+shift+f      move_window_forward
map  cmd+f            send_text all \x01
map  cmd+r            start_resizing_window

# Layouts
map  cmd+l            next_layout

# Font size
map  cmd+equal        change_font_size all +1.0
map  cmd+minus        change_font_size all -1.0
map  cmd+backspace    change_font_size all 0

# Opacity
map  cmd+a            set_background_opacity -0.05
map  cmd+b            set_background_opacity +0.05

# Scrollback
map  cmd+h            show_scrollback
map  cmd+g            show_last_command_output

# Clipboard
map  cmd+c            copy_to_clipboard
map  cmd+v            paste_from_clipboard
map  cmd+s            paste_from_selection

# Kitten helpers
map  cmd+p>f
# ── INCLUDE THEME ───────────────────────────────────────
# include ~/.config/kitty/current-theme.conf
