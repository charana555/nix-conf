# =========================
# STARSHIP CONFIG
# =========================
format = """
$os\
$username\
$directory\
$git_branch\
$git_status\
$fill\
$cmd_duration\
$nodejs\
$python\
$golang\
$nix_shell\
$time\
$line_break\
$character
"""

right_format = ""

add_newline = true

palette = "catppuccin"

# =========================
# PALETTES
# =========================

[palettes.catppuccin]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"

text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"

overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"

surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"

base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"

# =========================
# DIRECTORY
# =========================

[directory]
style = "bold blue"
truncate_to_repo = true
truncation_length = 3
fish_style_pwd_dir_length = 1
home_symbol = "~"
read_only = " 󰌾"
format = "[$path]($style)[$read_only]($read_only_style) "

# =========================
# GIT
# =========================

[git_branch]
symbol = " "
style = "bold mauve"
format = "[$symbol$branch]($style) "

[git_status]
style = "red"
format = '([\[$all_status$ahead_behind\]]($style)) '
conflicted = "="
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?"
stashed = "$"
modified = "!"
staged = "+"
renamed = "»"
deleted = "✘"

# =========================
# FILL
# =========================

[fill]
symbol = " "

# =========================
# COMMAND DURATION
# =========================

[cmd_duration]
min_time = 2000
format = "[$duration](overlay1) "
show_milliseconds = false

# =========================
# NODE
# =========================

[nodejs]
symbol = " "
style = "green"
format = "[$symbol($version )]($style)"

# =========================
# PYTHON
# =========================

[python]
symbol = " "
style = "yellow"
python_binary = "python3"
format = "[$symbol$version( \\($virtualenv\\)) ]($style)"

# =========================
# GO
# =========================

[golang]
symbol = " "
style = "sky"
format = "[$symbol($version )]($style)"

# =========================
# NIX SHELL
# =========================

[nix_shell]
symbol = " "
style = "lavender"
format = "[$symbol$state( \\($name\\)) ]($style)"

# =========================
# TIME
# =========================

[time]
disabled = false
time_format = "%H:%M"
style = "overlay1"
format = "[$time]($style)"

# =========================
# CHARACTER
# =========================

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold lavender)"

# =========================
# DISABLE UNUSED MODULES
# =========================

[aws]
disabled = true

[docker_context]
disabled = true

[package]
disabled = true

[rust]
disabled = true

[java]
disabled = true

[kubernetes]
disabled = true

[terraform]
disabled = true

[os]
disabled = false
style = "bg:surface0 fg:blue bold"
format = "[ $symbol ]($style)"

[os.symbols]
Alpine = " "
Amazon = " "
Android = " "
Arch = "󰣇 "
CentOS = " "
Debian = " "
Fedora = " "
Gentoo = " "
Linux = " "
Macos = " "
Manjaro = " "
Mint = "󰣭 "
NixOS = " "
Pop = " "
Ubuntu = " "
Windows = "󰍲 "

[username]
show_always = true
style_user = "bg:surface0 fg:lavender bold"
style_root = "bg:red fg:base bold"
format = "[ $user ]($style)"
